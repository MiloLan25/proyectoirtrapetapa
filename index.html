<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robótica IRTRA - Galería de Exposición</title>
  <!-- Fuente Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --bg-main: #f3f0ff;            /* Fondo violeta/pastel vibrante */
      --card-bg: #ffffff;            /* Blanco puro para tarjetas */
      --border-color: #e9d5ff;       /* Borde lila llamativo */
      --text-primary: #1e1b4b;       /* Indigo profundo */
      --text-muted: #6b21a8;         /* Púrpura intenso */
      --neon-cyan: #06b6d4;          /* Cyan eléctrico */
      --neon-pink: #ec4899;          /* Rosa fucsia */
      --neon-purple: #8b5cf6;        /* Violeta brillante */
      --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #ec4899 50%, #06b6d4 100%);
      --radius: 20px;
      --shadow-subtle: 0 10px 25px -5px rgba(139, 92, 246, 0.12);
      --shadow-hover: 0 20px 35px -5px rgba(236, 72, 153, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.4s;
    }

    /* Telón para Modo Presentación */
    body.presentation-mode {
      background-color: #0f0728;
    }
    body.presentation-mode .expo-card:not(.focused) {
      opacity: 0.15;
      filter: blur(3px);
    }

    .container {
      max-width: 1280px;
      width: 100%;
    }

    /* ENCABEZADO */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .tagline {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.4rem;
      border-radius: 50px;
      background: #f43f5e;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4);
    }

    header h1 {
      font-size: 3.8rem;
      font-weight: 800;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 600;
    }

    /* BARRA INTERACTIVA Y BÚSQUEDA */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      margin-bottom: 2.5rem;
      box-shadow: var(--shadow-subtle);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #faf5ff;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      border: 2px solid var(--border-color);
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-family: inherit;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-weight: 600;
    }

    .filter-btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn, .mode-btn {
      background: #faf5ff;
      border: 2px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--gradient-accent);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .mode-btn {
      background: #06b6d4;
      color: #ffffff;
      border-color: #0891b2;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }

    .mode-btn:hover {
      background: #0891b2;
      transform: translateY(-2px);
    }

    /* GRID DE EXPOSICIÓN */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(550px, 1fr));
      gap: 2rem;
    }

    /* TARJETAS LLAMATIVAS */
    .expo-card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-subtle);
      transition: all 0.3s ease;
      position: relative;
    }

    .expo-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-hover);
      border-color: var(--neon-pink);
    }

    .card-header {
      padding: 1.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #faf5ff;
      border-bottom: 2px solid var(--border-color);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .card-title h3 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pdf { background: #ffe4e6; color: #e11d48; border: 1px solid #f43f5e; }
    .badge-video { background: #e0f2fe; color: #0284c7; border: 1px solid #38bdf8; }

    /* VISTA PREVIA */
    .preview-box {
      width: 100%;
      height: 380px;
      background: #1e1b4b;
      position: relative;
    }

    .preview-box iframe, 
    .preview-box video {
      width: 100%;
      height: 100%;
      border: none;
      object-fit: contain;
    }

    .card-footer {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border-top: 2px solid var(--border-color);
    }

    .views-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 700;
    }

    .action-btn {
      background: var(--gradient-accent);
      border: none;
      color: #ffffff;
      padding: 0.5rem 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .action-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.5);
    }

    /* MODAL DE PANTALLA COMPLETA */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(15, 7, 40, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .modal-content {
      width: 90%;
      height: 90%;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 3px solid var(--neon-pink);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
    }

    .close-modal {
      position: absolute;
      top: 15px; right: 20px;
      background: #f43f5e;
      border: none;
      color: white;
      font-size: 1.2rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      z-index: 1001;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(244, 63, 94, 0.4);
    }

    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 2.5rem; }
      .controls-bar { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <div class="tagline"><i data-lucide="zap" size="16"></i> Muestra Tecnológica</div>
      <h1>Robótica IRTRA</h1>
      <p>Exposición digital de proyectos, investigaciones y recursos multimedia</p>
    </header>

    <!-- BARRA INTERACTIVA: FILTROS + BÚSQUEDA + MODO EXPOSICIÓN -->
    <div class="controls-bar">
      <div class="search-box">
        <i data-lucide="search" size="16" color="#6b21a8"></i>
        <input type="text" id="searchInput" placeholder="Buscar documento..." onkeyup="searchCards()">
      </div>

      <div class="filter-btn-group">
        <button class="filter-btn active" onclick="filterCategory('all', this)">Todos</button>
        <button class="filter-btn" onclick="filterCategory('pdf', this)">PDFs</button>
        <button class="filter-btn" onclick="filterCategory('video', this)">Videos</button>
      </div>

      <button class="mode-btn" onclick="togglePresentationMode()">
        <i data-lucide="tv" size="16"></i> Modo Exposición
      </button>
    </div>

    <!-- GALERÍA DE EXPOSICIÓN -->
    <div class="gallery-grid" id="galleryGrid">

      <!-- 1. INVESTIGACIÓN (PDF) -->
      <div class="expo-card" data-category="pdf" data-title="investigacion">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="file-text" color="#ec4899"></i>
            <h3>Investigación</h3>
          </div>
          <span class="badge badge-pdf">PDF</span>
        </div>
        <div class="preview-box">
          <!-- REEMPLAZA 'ruta/a/tu/investigacion.pdf' CON TU ARCHIVO LOCAL -->
          <iframe src="ruta/a/tu/investigacion.pdf#toolbar=0" title="Vista Previa Investigación"></iframe>
        </div>
        <div class="card-footer">
          <span class="views-counter" id="views-doc1"><i data-lucide="eye" size="14"></i> 0 vistas</span>
          <button class="action-btn" onclick="openModal('ruta/a/tu/investigacion.pdf', 'pdf', 'doc1', this)">
            <i data-lucide="maximize-2" size="14"></i> Ampliar Vista
          </button>
        </div>
      </div>

      <!-- 2. INFOGRAFÍA (PDF) -->
      <div class="expo-card" data-category="pdf" data-title="infografia">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="layout" color="#ec4899"></i>
            <h3>Infografía</h3>
          </div>
          <span class="badge badge-pdf">PDF</span>
        </div>
        <div class="preview-box">
          <!-- REEMPLAZA 'ruta/a/tu/infografia.pdf' CON TU ARCHIVO LOCAL -->
          <iframe src="ruta/a/tu/infografia.pdf#toolbar=0" title="Vista Previa Infografía"></iframe>
        </div>
        <div class="card-footer">
          <span class="views-counter" id="views-doc2"><i data-lucide="eye" size="14"></i> 0 vistas</span>
          <button class="action-btn" onclick="openModal('ruta/a/tu/infografia.pdf', 'pdf', 'doc2', this)">
            <i data-lucide="maximize-2" size="14"></i> Ampliar Vista
          </button>
        </div>
      </div>

      <!-- 3. PODCAST (VIDEO) -->
      <div class="expo-card" data-category="video" data-title="podcast">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="headphones" color="#06b6d4"></i>
            <h3>Podcast</h3>
          </div>
          <span class="badge badge-video">Video</span>
        </div>
        <div class="preview-box">
          <!-- REEMPLAZA 'ruta/a/tu/podcast.mp4' CON TU ARCHIVO LOCAL -->
          <video controls preload="metadata" onplay="countView('doc3')">
            <source src="ruta/a/tu/podcast.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
          </video>
        </div>
        <div class="card-footer">
          <span class="views-counter" id="views-doc3"><i data-lucide="eye" size="14"></i> 0 vistas</span>
          <button class="action-btn" onclick="openModal('ruta/a/tu/podcast.mp4', 'video', 'doc3', this)">
            <i data-lucide="maximize-2" size="14"></i> Pantalla Completa
          </button>
        </div>
      </div>

      <!-- 4. CIRCUITO (VIDEO) -->
      <div class="expo-card" data-category="video" data-title="circuito">
        <div class="card-header">
          <div class="card-title">
            <i data-lucide="cpu" color="#06b6d4"></i>
            <h3>Circuito</h3>
          </div>
          <span class="badge badge-video">Video</span>
        </div>
        <div class="preview-box">
          <!-- REEMPLAZA 'ruta/a/tu/circuito.mp4' CON TU ARCHIVO LOCAL -->
          <video controls preload="metadata" onplay="countView('doc4')">
            <source src="ruta/a/tu/circuito.mp4" type="video/mp4">
            Tu navegador no soporta el formato de video.
          </video>
        </div>
        <div class="card-footer">
          <span class="views-counter" id="views-doc4"><i data-lucide="eye" size="14"></i> 0 vistas</span>
          <button class="action-btn" onclick="openModal('ruta/a/tu/circuito.mp4', 'video', 'doc4', this)">
            <i data-lucide="maximize-2" size="14"></i> Pantalla Completa
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL DE VISUALIZACIÓN EXTENDIDA -->
  <div class="modal" id="previewModal">
    <button class="close-modal" onclick="closeModal()">&times;</button>
    <div class="modal-content" id="modalContainer"></div>
  </div>

  <script>
    lucide.createIcons();

    // Contador de Interacciones/Vistas
    const viewsState = { doc1: 0, doc2: 0, doc3: 0, doc4: 0 };

    function countView(id) {
      viewsState[id]++;
      const el = document.getElementById(`views-${id}`);
      if (el) {
        el.innerHTML = `<i data-lucide="eye" size="14"></i> ${viewsState[id]} vistas`;
        lucide.createIcons();
      }
    }

    // Filtros de categoría
    function filterCategory(type, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.expo-card').forEach(card => {
        if (type === 'all' || card.dataset.category === type) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }

    // Buscador interactivo
    function searchCards() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.expo-card').forEach(card => {
        const title = card.dataset.title.toLowerCase();
        card.style.display = title.includes(query) ? 'flex' : 'none';
      });
    }

    // Modo Exposición / Teatro
    function togglePresentationMode() {
      document.body.classList.toggle('presentation-mode');
    }

    // Destacar tarjeta en modo Exposición
    document.querySelectorAll('.expo-card').forEach(card => {
      card.addEventListener('click', () => {
        if (document.body.classList.contains('presentation-mode')) {
          document.querySelectorAll('.expo-card').forEach(c => c.classList.remove('focused'));
          card.classList.add('focused');
        }
      });
    });

    // Modal
    const modal = document.getElementById('previewModal');
    const modalContainer = document.getElementById('modalContainer');

    function openModal(src, type, id, btnElement) {
      countView(id);
      if(type === 'pdf') {
        modalContainer.innerHTML = `<iframe src="${src}" style="width:100%; height:100%; border:none;"></iframe>`;
      } else {
        modalContainer.innerHTML = `<video controls autoplay style="width:100%; height:100%; object-fit:contain;"><source src="${src}"></video>`;
      }
      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
      modalContainer.innerHTML = '';
    }
  </script>
</body>
</html>
